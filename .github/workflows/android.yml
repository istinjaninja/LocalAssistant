name: Android Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Test and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build APK
        run: ./gradlew testDebugUnitTest --tests "com.example.localassistant.ExampleUnitTest" --tests "com.localassistant.app.test.CommonUtilitiesTest" --tests "com.localassistant.app.test.LlmSettingsTest" --tests "com.localassistant.app.test.WakeWordDetectorTest" assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
